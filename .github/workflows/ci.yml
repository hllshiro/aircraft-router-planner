name: ci

# 分层门禁：
#   - static-check：push 到 master/main 与 PR 都跑，仅快速静态检查（cargo check + 依赖红线），不执行测试。
#   - 跨平台交叉编译与发布：见 release.yml，仅 v* tag 触发。
#   - 注意：所有测试用例已在 v0.5.0 中移除。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  static-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Static check (type-check, no codegen/test)
        run: cargo check --workspace --all-targets
      - name: Static dependency red-line (no blas/proj/C backend)
        shell: bash
        run: |
          if cargo tree -e normal | grep -iE "openblas|zlib|curl|\bproj\b|gdal|pcre|ssl"; then
            echo "FAIL: C dependency leak" >&2
            exit 1
          fi
