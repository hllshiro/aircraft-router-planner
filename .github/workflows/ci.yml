name: ci

# 日常检查门禁：push 到 master/main 与 pull_request 触发。
# 只做构建/测试/静态依赖红线检查；跨平台交叉编译与发布见 release.yml（仅 v* tag 触发）。

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build (release)
        run: cargo build --release --workspace
      - name: Tests
        run: |
          cargo test --lib
          cargo test --test crash_suite
          cargo test --test determinism
          cargo test --test regress_phase0
          # 压缩解压性能/正确性 field_build_compare（~7min，真实地形 1024²
          # 冷缓存 zstd 解压对比）不在全量门禁：仅在修改/验证压缩解压相关
          # 代码时手动运行 cargo test --test compare（主管 2026-08-13 决策）
      - name: Static dependency red-line (no blas/proj/C backend)
        shell: bash
        run: |
          if cargo tree -e normal | grep -iE "openblas|zlib|curl|\bproj\b|gdal|pcre|ssl"; then
            echo "FAIL: C dependency leak" >&2
            exit 1
          fi
