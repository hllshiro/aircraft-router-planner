name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: aircraft-router-planner-cli-windows-amd64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: aircraft-router-planner-cli-windows-arm64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: aircraft-router-planner-cli-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: aircraft-router-planner-cli-linux-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}

      # Linux musl 静态二进制（零 glibc 依赖）用 zig 作交叉链接器，
      # 统一覆盖 x86_64 与 aarch64 两个 musl 目标（纯 Rust 项目，无 C 依赖）。
      - name: Install zig (cross linker)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v1

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (Linux musl via zigbuild)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --target ${{ matrix.target }} -p aircraft-router-planner-cli

      - name: Build (Windows MSVC)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }} -p aircraft-router-planner-cli

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/aircraft-router-planner-cli.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/aircraft-router-planner-cli" "dist/${{ matrix.asset }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 Cargo.toml version ${cargo_version} 不一致，请先 scripts/bump_version.sh"
            exit 1
          fi
          echo "version OK: v${cargo_version}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum aircraft-router-planner-cli-* | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
